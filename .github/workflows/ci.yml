name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest tests/ -v
    
    - name: Run linting
      run: |
        pip install flake8 black mypy
        flake8 backend/
        black --check backend/
        mypy backend/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend-react
        npm ci
    
    - name: Run linting
      run: |
        cd frontend-react
        npm run lint
    
    - name: Run unit tests
      run: |
        cd frontend-react
        npm run test
    
    - name: Build frontend
      run: |
        cd frontend-react
        npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd frontend-react
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd frontend-react
        npx playwright install --with-deps
    
    - name: Run E2E tests
      run: |
        cd frontend-react
        npm run test:e2e
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: frontend-react/playwright-report/
        retention-days: 7

  load-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust
    
    - name: Run load tests
      run: |
        cd backend
        locust -f tests/load_test.py --headless --users 10 --spawn-rate 1 --run-time 30s --host http://localhost:8000
      env:
        DATABASE_PATH: ":memory:"

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      run: |
        pip install safety bandit
        safety check
        bandit -r backend/
    
    - name: Run dependency audit
      run: |
        cd frontend-react
        npm audit --audit-level=high
